<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working Clock</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1db954, #191414);
            font-family: Arial, sans-serif;
        }
        
        .clock {
            width: 200px;
            height: 200px;
            border: 8px solid #1db954;
            border-radius: 50%;
            position: relative;
            background: #191414;
            box-shadow: 0 0 20px rgba(29, 185, 84, 0.5);
        }
        
        .center {
            width: 12px;
            height: 12px;
            background: #1db954;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            background: #1db954;
        }
        
        .hour {
            width: 4px;
            height: 50px;
            margin-left: -2px;
        }
        
        .minute {
            width: 3px;
            height: 70px;
            margin-left: -1.5px;
        }
        
        .second {
            width: 2px;
            height: 75px;
            margin-left: -1px;
            background: #ff1744;
        }
        
        .digital {
            text-align: center;
            color: #1db954;
            font-size: 24px;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div>
        <div class="clock">
            <div class="hand hour" id="hour"></div>
            <div class="hand minute" id="minute"></div>
            <div class="hand second" id="second"></div>
            <div class="center"></div>
        </div>
        <div class="digital" id="digital"></div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = now.getHours() % 12;
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            
            const hourHand = document.getElementById('hour');
            const minuteHand = document.getElementById('minute');
            const secondHand = document.getElementById('second');
            const digitalDisplay = document.getElementById('digital');
            
            hourHand.style.transform = `rotate(${(hours * 30) + (minutes * 0.5)}deg)`;
            minuteHand.style.transform = `rotate(${(minutes * 6) + (seconds * 0.1)}deg)`;
            secondHand.style.transform = `rotate(${seconds * 6}deg)`;
            
            digitalDisplay.textContent = now.toLocaleTimeString();
        }
        
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
